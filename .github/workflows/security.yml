name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  bandit:
    name: Bandit (Python SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install bandit
      - run: bandit -r verify_web_stack.py test_keyless_fallback.py vn_news.py gateway searchstore vn_geo scripts trust.py depth_policy.py research_pack.py fact_check.py deep_research.py verify_deep_research.py tests -ll
