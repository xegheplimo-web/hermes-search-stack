# Ruff + pytest configuration for hermes-search-stack.
# CI runs: `ruff check .`, `ruff format --check .`, `pytest -q` (see .github/workflows/ci.yml).

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
